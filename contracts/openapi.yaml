openapi: 3.1.0
info:
  title: Aidy Canonical API Contract
  version: 1.0.0
  description: |
    Generated from canonical artifacts.
    Canonical sources do not enumerate concrete public HTTP/WS endpoint paths.
    This contract therefore models canonical internal tool APIs only via vendor extension.
servers: []
paths: {}
components:
  securitySchemes:
    SupabaseJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
x-canonical-sources:
  - docs/canonical/schema.md
  - docs/canonical/tools_schemas.json
  - docs/appendix_a_api_reference.md
x-tool-contracts:
  search_products:
    inputSchema:
      type: object
      properties:
        query:
          type: "string"
          description: "Free-text search. Max 200 chars."
        category:
          type: "string"
          description: "Exact match on products.category"
        color:
          type: "string"
          description: "Exact match on product_variants.color"
        size:
          type: "string"
          description: "Exact match on product_variants.size"
        brand:
          type: "string"
          description: "Exact match on products.brand"
        price_max:
          type: "number"
          description: "Filter: price <= price_max"
        in_stock_only:
          type: "boolean"
          description: "Default: true. Filter: stock > 0"
        limit:
          type: "integer"
          description: "Default: 5. Range: 1-20."
      required: []
    invariants:
      - "Returns: Array<{ product_id, variant_id, name, description, category, brand, price, size, color, stock, image_url }>"
      - "Access: Read-only. Tenant-scoped. Uses hybrid retrieval: SQL filters → pg_trgm → optional rerank."
  check_stock:
    inputSchema:
      type: object
      properties:
        product_id:
          type: "string (UUID)"
          description: "Must exist in tenant’s products"
        variant_id:
          type: "string (UUID)"
          description: "If omitted, returns all variants"
      required:
        - product_id
    invariants:
      - "Returns: { in_stock: bool, quantity: int, variants: Array<{ variant_id, size, color, stock }> }"
  add_to_cart:
    inputSchema:
      type: object
      properties:
        product_id:
          type: "string (UUID)"
          description: "Must come from a prior search_products result in this conversation"
        variant_id:
          type: "string (UUID)"
          description: "Required if product has variants"
        quantity:
          type: "integer"
          description: "Range: 1-99"
      required:
        - product_id
        - quantity
    invariants:
      - "Returns: Updated cart object { items: [...], item_count, subtotal }"
      - "Side effect: Writes to conversations.cart_state ONLY. Does not touch products/stock."
  remove_from_cart:
    inputSchema:
      type: object
      properties:
        product_id:
          type: "string (UUID)"
          description: "Must exist in current cart"
        variant_id:
          type: "string (UUID)"
          description: "If product has variants"
      required:
        - product_id
    invariants:
      - "Returns: Updated cart object."
  calculate_total:
    inputSchema:
      type: object
      properties:
        conversation_id:
          type: "string (UUID)"
          description: "Implicit from context (injected by orchestrator)"
      required:
        - conversation_id
    invariants:
      - "Returns: { items: [{ name, qty, unit_price, line_total }], subtotal, delivery_fee, total }"
      - "Execution: DETERMINISTIC Python function. Reads cart_state, queries current prices, applies business rules (delivery fee logic). NO LLM INVOLVEMENT."
  create_order:
    inputSchema:
      type: object
      properties:
        conversation_id:
          type: "string (UUID)"
          description: "Implicit from context"
        delivery_name:
          type: "string"
          description: "Customer name"
        delivery_phone:
          type: "string"
          description: "E.164 or local format"
        delivery_address:
          type: "string"
          description: "Full address"
        delivery_city:
          type: "string"
        notes:
          type: "string"
          description: "Customer notes"
        idempotency_key:
          type: "string"
          description: "Generated by orchestrator: conv_id + timestamp hash"
      required:
        - conversation_id
        - delivery_name
        - delivery_phone
        - delivery_address
        - delivery_city
        - idempotency_key
    invariants:
      - "PRECONDITION: conversations.confirm_state MUST be true. If false, tool returns error and agent must ask for confirmation."
      - "Returns: { order_id, status: 'pending', summary }"
      - "Side effects: Creates order + order_items records. Resets cart_state. Sends merchant notification."
  get_order_status:
    inputSchema:
      type: object
      properties:
        order_id:
          type: "string (UUID)"
          description: "Must belong to current customer"
      required:
        - order_id
    invariants:
      - "Returns: { order_id, status, items, total, created_at, updated_at }"
  analyze_image:
    inputSchema:
      type: object
      properties:
        image_url:
          type: "string"
          description: "URL to image in Supabase Storage"
        conversation_summary:
          type: "string"
          description: "Last 3 messages summarized (injected by orchestrator)"
        task:
          type: "string"
          description: "Enum: diagnose, identify_product, visual_search"
      required:
        - image_url
        - conversation_summary
        - task
    invariants:
      - "Returns: { analysis: string, confidence: float, tags: string[], suggested_products: UUID[] }"
      - "Execution: Calls vision model (Gemini Flash). Result is validated, then injected into chat model context."
  escalate_to_human:
    inputSchema:
      type: object
      properties:
        reason:
          type: "string"
          description: "Why the agent is escalating"
        conversation_id:
          type: "string (UUID)"
          description: "Implicit from context"
      required:
        - reason
        - conversation_id
    invariants:
      - "Side effects: Sets conversation.mode = 'manual'. Sends dashboard notification + optional WhatsApp message to merchant."
